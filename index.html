<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 로스터 관리 & 시즌 현황판 </title>
    <link rel="manifest" href="manifest.json">
    <!-- Tailwind CSS CDN -->

                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCYms9BtVzC5HAnlE5-aHCADIcz75x2uTk",
            authDomain: "roster-management-34257.firebaseapp.com",
            projectId: "roster-management-34257",
            storageBucket: "roster-management-34257.firebasestorage.app",
            messagingSenderId: "661118063311",
            appId: "1:661118063311:web:813cfb51acace930e55dba",
            measurementId: "G-1T0TD0SLFL"
        };

        const app = initializeApp(firebaseConfig);

        window.db = db;
        window.dbDocRef = doc(db, "managerData", "mainData");

        window.loadDataFromCloud();

    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { height: 8px; width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }

</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 min-h-screen flex flex-col md:flex-row">

    <!-- [모바일 전용] 상단 헤더바 -->
    <header class="md:hidden bg-slate-900 text-white p-4 flex items-center justify-between sticky top-0 z-30 border-b border-slate-800 shadow-md">
        <div class="flex items-center space-x-2.5">
            <div class="bg-brand-600 text-white p-2 rounded-xl shadow-md">
                <i data-lucide="trophy" class="w-4 h-4"></i>
            </div>
            <div>
                <h1 class="font-bold text-sm leading-tight">로스터 관리</h1>
                <p class="text-[10px] text-slate-400">By 김상현</p>
            </div>
        </div>
        <button onclick="toggleMobileMenu()" class="p-2.5 bg-slate-800 border border-slate-700 rounded-xl text-xs font-semibold flex items-center space-x-1.5 active:scale-95 transition">
            <i data-lucide="menu" class="w-4 h-4"></i>
            <span>메뉴</span>
        </button>
    </header>

    <!-- [모바일 전용] 슬라이드 메뉴 드로어 -->
    <div id="mobileMenuDrawer" class="md:hidden fixed inset-0 bg-slate-950/90 backdrop-blur-sm z-50 hidden flex flex-col p-6 space-y-6 overflow-y-auto text-slate-300">
        <div class="flex justify-between items-center border-b border-slate-800 pb-4">
            <div class="flex items-center space-x-2">
                <div class="bg-brand-600 text-white p-1.5 rounded-lg"><i data-lucide="trophy" class="w-4 h-4"></i></div>
                <span class="font-bold text-base text-white">메뉴 및 시즌 목록</span>
            </div>
            <button onclick="toggleMobileMenu()" class="p-2 text-slate-400 text-2xl font-bold hover:text-white">×</button>
        </div>
        <div class="space-y-4">
            <div>
                <div class="text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-2">팀 관리 홈</div>
                <button onclick="switchMainView('op'); toggleMobileMenu();" class="w-full flex items-center space-x-2.5 py-3 px-4 rounded-xl font-semibold text-xs transition bg-brand-600 text-white shadow-sm">
                    <i data-lucide="settings" class="w-4 h-4"></i>
                    <span>로스터 및 운영 관리</span>
                </button>
            </div>
            <div>
                <div class="flex items-center justify-between text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-2">
                    <span>시즌 현황</span>
                    <button onclick="promptAddSeason(); toggleMobileMenu();" class="text-brand-400 hover:text-brand-300 flex items-center space-x-0.5 text-[11px] font-semibold">
                        <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                        <span>새 시즌</span>
                    </button>
                </div>
                <div id="mobileSidebarSeasonList" class="space-y-3"></div>
            </div>
        </div>
    </div>

    <!-- [PC 전용] 좌측 사이드바 네비게이션 -->
    <aside class="w-64 bg-slate-900 text-slate-300 flex-col border-r border-slate-800 shrink-0 h-screen sticky top-0 overflow-y-auto hidden md:flex">
        <div class="p-5 border-b border-slate-800 flex items-center space-x-3">
            <div class="bg-brand-600 text-white p-2 rounded-xl shadow-md">
                <i data-lucide="trophy" class="w-5 h-5"></i>
            </div>
            <div>
                <h1 class="font-bold text-sm text-white leading-tight">로스터 관리</h1>
                <p class="text-[11px] text-slate-400">Made by 김상현</p>
            </div>
        </div>

        <div class="p-4 space-y-6 flex-1">
            <div>
                <div class="text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-2 px-2">팀 관리</div>
                <button onclick="switchMainView('op')" id="sidebar-btn-op" class="w-full flex items-center space-x-2.5 py-2.5 px-3 rounded-xl font-semibold text-xs transition bg-brand-600 text-white shadow-sm">
                    <i data-lucide="settings" class="w-4 h-4"></i>
                    <span>로스터 관리</span>
                </button>
            </div>

            <div>
                <div class="flex items-center justify-between text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-2 px-2">
                    <span>시즌 현황</span>
                    <button onclick="promptAddSeason()" class="text-brand-400 hover:text-brand-300 flex items-center space-x-0.5 text-[11px] font-semibold">
                        <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                        <span>새 시즌</span>
                    </button>
                </div>
                <div id="sidebarSeasonList" class="space-y-3"></div>
            </div>
        </div>
    </aside>

    <!-- Main Content Container -->
    <main class="flex-1 w-full md:max-w-[calc(100vw-16rem)] min-h-screen overflow-y-auto p-4 sm:p-6 md:p-8">

        <!-- ==================== 1. 운영 관리 VIEW ==================== -->
        <section id="view-op" class="space-y-6 max-w-7xl mx-auto">
            <div class="flex overflow-x-auto custom-scrollbar gap-2 p-1.5 bg-slate-200/60 dark:bg-slate-800 rounded-2xl border border-slate-200/80 whitespace-nowrap">
                <button onclick="switchOpSubTab('global')" id="subnav-global" class="op-subnav-btn flex-1 min-w-[120px] py-2.5 px-3 text-xs sm:text-sm font-semibold rounded-xl transition shadow-sm bg-white dark:bg-slate-700 text-slate-900 dark:text-white">전체 로스터 관리</button>
                <button onclick="switchOpSubTab('roster')" id="subnav-roster" class="op-subnav-btn flex-1 min-w-[120px] py-2.5 px-3 text-xs sm:text-sm font-semibold rounded-xl transition text-slate-600 dark:text-slate-400 hover:text-slate-900">로스터 관리</button>
                <button onclick="switchOpSubTab('draft')" id="subnav-draft" class="op-subnav-btn flex-1 min-w-[120px] py-2.5 px-3 text-xs sm:text-sm font-semibold rounded-xl transition text-slate-600 dark:text-slate-400 hover:text-slate-900">드래프트</button>
                <button onclick="switchOpSubTab('team1')" id="subnav-team1" class="op-subnav-btn flex-1 min-w-[120px] py-2.5 px-3 text-xs sm:text-sm font-semibold rounded-xl transition text-slate-600 dark:text-slate-400 hover:text-slate-900">1팀 로스터</button>
                <button onclick="switchOpSubTab('team2')" id="subnav-team2" class="op-subnav-btn flex-1 min-w-[120px] py-2.5 px-3 text-xs sm:text-sm font-semibold rounded-xl transition text-slate-600 dark:text-slate-400 hover:text-slate-900">2팀 로스터</button>
            </div>

            <!-- Sub Tab 1: 전체 로스터 관리 -->
            <div id="op-subtab-global" class="op-sub-card space-y-6">
                <div class="bg-white dark:bg-slate-800 p-4 sm:p-5 rounded-2xl border shadow-sm space-y-4">
                    <h3 class="text-base font-bold flex items-center space-x-2">
                        <i data-lucide="user-plus" class="w-5 h-5 text-brand-600"></i>
                        <span>신규 선수 등록</span>
                    </h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-1">선수 이름</label>
                            <input type="text" id="inputName" placeholder="선수명 입력" class="w-full bg-slate-50 dark:bg-slate-900 border rounded-xl px-3 py-2.5 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-1">포지션</label>
                            <select id="inputPos" class="w-full bg-slate-50 dark:bg-slate-900 border rounded-xl px-3 py-2.5 text-sm">
                                <option value="선발투수">선발투수</option>
                                <option value="릴리프">릴리프</option>
                                <option value="불펜">불펜</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-1">투타 (손)</label>
                            <select id="inputHand" class="w-full bg-slate-50 dark:bg-slate-900 border rounded-xl px-3 py-2.5 text-sm">
                                <option value="우">우투우타 (우)</option>
                                <option value="좌">좌투좌타 (좌)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-1">등번호</label>
                            <input type="number" id="inputBackNum" placeholder="등번호" class="w-full bg-slate-50 dark:bg-slate-900 border rounded-xl px-3 py-2.5 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-1">선수 유형</label>
                            <select id="inputType" class="w-full bg-slate-50 dark:bg-slate-900 border rounded-xl px-3 py-2.5 text-sm">
                                <option value="현역">현역</option>
                                <option value="밀전드">밀전드</option>
                                <option value="공통 선수">공통 선수</option>
                                <option value="절대 선수">절대 선수</option>
                            </select>
                        </div>
                        <div class="flex items-end">
                            <button onclick="registerGlobalPlayer()" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-2.5 px-4 rounded-xl transition text-sm shadow-sm">등록하기</button>
                        </div>
                    </div>
                </div>

                <div class="bg-white dark:bg-slate-800 rounded-2xl border shadow-sm overflow-hidden">
                    <div class="p-4 border-b flex justify-between items-center">
                        <h3 class="font-bold text-sm sm:text-base">전체 등록 선수 명단</h3>
                        <span id="globalPlayerCount" class="text-xs font-bold px-2.5 py-1 bg-slate-100 dark:bg-slate-700 rounded-lg">총 0명</span>
                    </div>
                    <!-- 모바일 가독성을 위해 가로 스크롤(overflow-x-auto) 및 테이블 최소 너비 부여 -->
                    <div class="overflow-x-auto custom-scrollbar">
                        <table class="w-full min-w-[550px] text-sm text-left">
                            <tbody id="globalPlayerTableBody" class="divide-y"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Sub Tab 2: 로스터 관리 -->
            <div id="op-subtab-roster" class="op-sub-card hidden space-y-6">
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="bg-white dark:bg-slate-800 rounded-2xl border shadow-sm overflow-hidden flex flex-col"><div class="p-4 bg-slate-50 dark:bg-slate-900 border-b font-bold flex justify-between"><span>선발투수</span><span id="rosterStarterCount" class="text-xs bg-brand-100 text-brand-700 px-2 rounded-full">0명</span></div><table class="w-full text-xs"><tbody id="rosterStarterBody" class="divide-y"></tbody></table></div>
                    <div class="bg-white dark:bg-slate-800 rounded-2xl border shadow-sm overflow-hidden flex flex-col"><div class="p-4 bg-slate-50 dark:bg-slate-900 border-b font-bold flex justify-between"><span>릴리프</span><span id="rosterReliefCount" class="text-xs bg-brand-100 text-brand-700 px-2 rounded-full">0명</span></div><table class="w-full text-xs"><tbody id="rosterReliefBody" class="divide-y"></tbody></table></div>
                    <div class="bg-white dark:bg-slate-800 rounded-2xl border shadow-sm overflow-hidden flex flex-col"><div class="p-4 bg-slate-50 dark:bg-slate-900 border-b font-bold flex justify-between"><span>불펜</span><span id="rosterBullpenCount" class="text-xs bg-brand-100 text-brand-700 px-2 rounded-full">0명</span></div><table class="w-full text-xs"><tbody id="rosterBullpenBody" class="divide-y"></tbody></table></div>
                </div>
                
                <div class="bg-white dark:bg-slate-800 rounded-2xl border shadow-sm overflow-hidden">
                    <div class="p-4 bg-slate-100 dark:bg-slate-900 border-b font-bold text-slate-500 flex justify-between"><span>방출 선수 명단</span><span id="rosterReleaseCount" class="text-xs bg-slate-200 dark:bg-slate-800 px-2 rounded-full">0명</span></div>
                    <table class="w-full text-xs"><tbody id="rosterReleaseBody" class="divide-y"></tbody></table>
                </div>

                <!-- 등번호 종합 매트릭스 -->
                <div class="bg-white dark:bg-slate-800 rounded-2xl border shadow-sm overflow-hidden space-y-3 p-4 sm:p-5">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b pb-3 gap-2">
                        <h3 class="font-bold text-sm sm:text-base flex items-center space-x-2">
                            <i data-lucide="grid" class="w-5 h-5 text-brand-600"></i>
                            <span>등번호 종합 매트릭스 (0 ~ 99번)</span>
                        </h3>
                        <div class="flex flex-wrap items-center gap-2 text-[11px] font-semibold">
                            <span class="flex items-center space-x-1"><span class="w-3 h-3 bg-blue-100 border border-blue-300 rounded inline-block"></span><span>현역</span></span>
                            <span class="flex items-center space-x-1"><span class="w-3 h-3 bg-amber-100 border border-amber-300 rounded inline-block"></span><span>밀전드</span></span>
                            <span class="flex items-center space-x-1"><span class="w-3 h-3 bg-emerald-100 border border-emerald-300 rounded inline-block"></span><span>공통</span></span>
                            <span class="flex items-center space-x-1"><span class="w-3 h-3 bg-rose-100 border border-rose-300 rounded inline-block"></span><span>절대</span></span>
                            <span class="flex items-center space-x-1"><span class="w-3 h-3 bg-slate-300 border border-slate-400 rounded inline-block"></span><span>방출</span></span>
                        </div>
                    </div>
                    <div class="overflow-x-auto custom-scrollbar">
                        <table class="w-full text-xs text-center border-collapse border border-slate-300 dark:border-slate-700">
                            <thead class="bg-slate-100 dark:bg-slate-900 text-slate-600 font-bold">
                                <tr id="backNumMatrixHead"></tr>
                            </thead>
                            <tbody id="backNumMatrixBody" class="divide-y divide-slate-300 dark:divide-slate-700"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Sub Tab 3: 드래프트 -->
            <div id="op-subtab-draft" class="op-sub-card hidden space-y-6">
                <div class="bg-white dark:bg-slate-800 p-4 sm:p-5 rounded-2xl border shadow-sm flex flex-col md:flex-row justify-between items-center gap-4">
                    <div class="inline-flex p-1 bg-slate-100 dark:bg-slate-900 rounded-xl border w-full md:w-auto">
                        <button onclick="switchDraftPos('starter')" id="draft-pos-starter" class="draft-pos-btn flex-1 md:flex-none py-2 px-4 text-xs font-semibold rounded-lg bg-white shadow-sm">선발</button>
                        <button onclick="switchDraftPos('relief')" id="draft-pos-relief" class="draft-pos-btn flex-1 md:flex-none py-2 px-4 text-xs font-semibold rounded-lg text-slate-600">릴리프</button>
                        <button onclick="switchDraftPos('bullpen')" id="draft-pos-bullpen" class="draft-pos-btn flex-1 md:flex-none py-2 px-4 text-xs font-semibold rounded-lg text-slate-600">불펜</button>
                    </div>
                    <div class="space-x-2 flex flex-wrap gap-2 w-full md:w-auto justify-end">
                        <button onclick="executeRandomDraft()" class="flex-1 md:flex-none bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold py-2.5 px-3.5 rounded-xl shadow-sm">무작위 드래프트</button>
                        <button onclick="executeRosterInspection()" class="flex-1 md:flex-none bg-brand-600 hover:bg-brand-700 text-white text-xs font-semibold py-2.5 px-3.5 rounded-xl shadow-sm">로스터 점검</button>
                        <button onclick="saveFinalRosters()" class="flex-1 md:flex-none bg-purple-600 hover:bg-purple-700 text-white text-xs font-semibold py-2.5 px-3.5 rounded-xl shadow-sm">최종 저장</button>
                    </div>
                </div>
                <div class="bg-white dark:bg-slate-800 rounded-2xl border shadow-sm overflow-hidden">
                    <div class="p-4 border-b font-bold flex justify-between items-center"><span id="draftEligibleTitle">대기 선수 목록</span><span id="draftEligibleCount" class="text-xs bg-slate-100 dark:bg-slate-700 px-2.5 py-1 rounded-lg">0명</span></div>
                    <div class="overflow-x-auto max-h-48 custom-scrollbar"><table class="w-full text-xs text-left"><tbody id="draftEligibleBody" class="divide-y"></tbody></table></div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="bg-white dark:bg-slate-800 rounded-2xl border shadow-sm overflow-hidden"><div class="p-4 bg-brand-50/50 dark:bg-brand-950/30 border-b font-bold text-brand-700 dark:text-brand-400 flex justify-between"><span>🔵 1팀 지명 현황</span><span id="team1DraftCount" class="text-xs bg-brand-100 dark:bg-brand-900 text-brand-700 dark:text-brand-300 px-2 rounded-full">0명</span></div><table class="w-full text-xs"><tbody id="team1DraftBody" class="divide-y"></tbody></table></div>
                    <div class="bg-white dark:bg-slate-800 rounded-2xl border shadow-sm overflow-hidden"><div class="p-4 bg-amber-50/50 dark:bg-amber-950/30 border-b font-bold text-amber-700 dark:text-amber-400 flex justify-between"><span>🟠 2팀 지명 현황</span><span id="team2DraftCount" class="text-xs bg-amber-100 dark:bg-amber-900 text-amber-700 dark:text-amber-300 px-2 rounded-full">0명</span></div><table class="w-full text-xs"><tbody id="team2DraftBody" class="divide-y"></tbody></table></div>
                </div>
            </div>

            <!-- Sub Tab 4: 1팀 로스터 -->
            <div id="op-subtab-team1" class="op-sub-card hidden bg-white dark:bg-slate-800 rounded-2xl border p-4 sm:p-5 shadow-sm">
                <div class="flex justify-between items-center mb-4"><h3 class="font-bold text-brand-700 dark:text-brand-400 text-base">🔵 1팀 로스터</h3><span id="team1FinalTotalCount" class="text-xs font-bold px-2.5 py-1 bg-brand-50 dark:bg-brand-950 text-brand-700 dark:text-brand-300 rounded-lg">총 0명</span></div>
                <div class="overflow-x-auto"><table class="w-full text-sm"><tbody id="team1FinalTableBody" class="divide-y"></tbody></table></div>
            </div>

            <!-- Sub Tab 5: 2팀 로스터 -->
            <div id="op-subtab-team2" class="op-sub-card hidden bg-white dark:bg-slate-800 rounded-2xl border p-4 sm:p-5 shadow-sm">
                <div class="flex justify-between items-center mb-4"><h3 class="font-bold text-amber-600 dark:text-amber-400 text-base">🟠 2팀 로스터</h3><span id="team2FinalTotalCount" class="text-xs font-bold px-2.5 py-1 bg-amber-50 dark:bg-amber-950 text-amber-700 dark:text-amber-300 rounded-lg">총 0명</span></div>
                <div class="overflow-x-auto"><table class="w-full text-sm"><tbody id="team2FinalTableBody" class="divide-y"></tbody></table></div>
            </div>
        </section>

        <!-- ==================== 2. 시즌별 4개 탭 컨테이너 ==================== -->
        <div id="seasonMatrixViewsContainer"></div>

    </main>

    <!-- 정규시즌 셀 모달 -->

        async function loadDataFromCloud() {
            try {
                const docSnap = await window.firestoreModule.getDoc(window.dbDocRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data.players) globalPlayers = data.players;
                    if (data.seasons) seasons = data.seasons;
                    console.log("클라우드에서 데이터를 성공적으로 불러왔습니다.");
                } else {

                    await saveStateToCloud(); 
                }
                refreshAppUI();
            } catch (error) {
                console.error("데이터 로드 중 오류 발생:", error);
                refreshAppUI();
            }
        }

        async function saveStateToCloud() {
            try {
                await window.firestoreModule.setDoc(window.dbDocRef, {
                    players: globalPlayers,
                    seasons: seasons
                });
                console.log("클라우드에 데이터가 저장되었습니다.");
            } catch (error) {

        function sortRosterCategoryList(list) {
            const absolutes = list.filter(p => p.type === '절대 선수');
            const activesAndMilends = list.filter(p => p.type === '현역' || p.type === '밀전드');
            const lefties = activesAndMilends.filter(p => p.hand === '좌');
            const righties = activesAndMilends.filter(p => p.hand !== '좌');
            const commons = list.filter(p => p.type === '공통 선수');
            return [...absolutes, ...lefties, ...righties, ...commons];
        }

        function sortMatrixPlayers(playersList) {
            const posOrder = { '선발투수': 1, '릴리프': 2, '불펜': 3 };
            const typeRank = { '절대 선수': 1, '현역': 2, '밀전드': 2, '공통 선수': 3 };
            return [...playersList].sort((a, b) => {
                if ((posOrder[a.position] || 99) !== (posOrder[b.position] || 99)) return (posOrder[a.position] || 99) - (posOrder[b.position] || 99);
                if ((typeRank[a.type] || 99) !== (typeRank[b.type] || 99)) return (typeRank[a.type] || 99) - (typeRank[b.type] || 99);
                return (a.backNum || 0) - (b.backNum || 0);
            });
        }

        function getGrandMasterTimeline() {
            let timeline = [];
            for (let g = 1; g <= 84; g++) timeline.push({ category: 'reg', type: 'game', gNum: g, label: `${g}G` });
            for (let ab = 1; ab <= 6; ab++) timeline.push({ category: 'reg', type: 'allstar', gNum: null, label: `ASB${ab}` });
            for (let g = 85; g <= 160; g++) timeline.push({ category: 'reg', type: 'game', gNum: g, label: `${g}G` });
            return timeline;
        }

        function computePlayerTimelineStatus(season, playerName) {
            const timeline = getGrandMasterTimeline();
            let statusMap = new Array(timeline.length).fill(null);
            let explicitMap = {};

            if (season.gamesData && season.gamesData['reg'] && season.gamesData['reg'][playerName]) {
                const pData = season.gamesData['reg'][playerName];
                Object.keys(pData).forEach(gStr => {
                    let gNum = parseInt(gStr);
                    let idx = timeline.findIndex(t => t.category === 'reg' && t.type === 'game' && t.gNum === gNum);
                    if (idx !== -1) explicitMap[idx] = pData[gNum];
                });
            }

            let i = 0;
            while (i < timeline.length) {
                let tItem = timeline[i];
                if (tItem.type === 'allstar') {
                    statusMap[i] = { status: null, comment: '올스타 브레이크' };
                    i++;
                    continue;
                }

                if (explicitMap[i]) {
                    let trig = explicitMap[i];
                    let st = trig.status;
                    let comment = trig.comment;
                    let isRegFirstGame = (tItem.gNum === 1);

                    let duration = 0;
                    if (st === '마이너') {
                        duration = (comment.includes('최신화')) ? 1 : (isRegFirstGame ? 1 : 10);
                    } else if (st === '부상 15일') duration = 15;
                    else if (st === '부상 30일') duration = 30;
                    else if (st === '부상 60일') duration = 60;
                    else if (st === '시즌아웃' || st === '토미존') duration = 99999;
                    else if (st === '메이저') duration = 1;

                    let filled = 0;
                    let curIdx = i;
                    while (curIdx < timeline.length && filled < duration) {
                        let curT = timeline[curIdx];
                        if (curT.type === 'allstar') {
                            statusMap[curIdx] = { status: st, comment: '올스타 브레이크 소모' };
                            curIdx++;
                            continue;
                        }

                        let dispSt = st;
                        let dispCom = (filled === 0) ? comment : (st === '마이너' ? '최소 등록 기간' : '기간 자동 연장');
                        statusMap[curIdx] = { status: dispSt, comment: dispCom };
                        filled++;
                        curIdx++;
                    }
                    i = curIdx;
                } else {
                    statusMap[i] = null;
                    i++;
                }
            }
            return { timeline, statusMap };
        }

        function getPlayerCarryoverStatus(season, playerName) {
            const { timeline, statusMap } = computePlayerTimelineStatus(season, playerName);
            let activeStatus = null;
            let remainingDays = 0;

            for (let i = 0; i < timeline.length; i++) {
                let stInfo = statusMap[i];
                if (stInfo && stInfo.status) {
                    activeStatus = stInfo.status;
                    let baseTrig = season.gamesData?.['reg']?.[playerName]?.[timeline[i].gNum];
                    if (baseTrig && baseTrig.status === activeStatus) {
                        let isRegFirstGame = (timeline[i].gNum === 1);
                        if (activeStatus === '마이너') remainingDays = isRegFirstGame ? 1 : 10;
                        else if (activeStatus === '부상 15일') remainingDays = 15;
                        else if (activeStatus === '부상 30일') remainingDays = 30;
                        else if (activeStatus === '부상 60일') remainingDays = 60;
                        else if (activeStatus === '시즌아웃' || activeStatus === '토미존') remainingDays = 99999;
                    }
                }
                if (activeStatus) remainingDays--;
                if (remainingDays <= 0) activeStatus = null;
            }
            return { activeStatus, remainingDays: Math.max(0, remainingDays) };
        }

        function computePlayerStatsSummary(season, playerName, rangeType) {
            const { timeline, statusMap } = computePlayerTimelineStatus(season, playerName);
            let majorDays = 0, minorDays = 0, injuryDays = 0;
            timeline.forEach((t, idx) => {
                if (t.type === 'game') {
                    if (rangeType === 'firstHalf' && t.gNum > 84) return;
                    let stInfo = statusMap[idx];
                    if (stInfo && stInfo.status) {
                        let st = stInfo.status;
                        if (st === '메이저') majorDays++;
                        else if (st === '마이너') minorDays++;
                        else if (st.includes('부상') || st === '시즌아웃' || st === '토미존') injuryDays++;
                    }
                }
            });
            return { majorDays, minorDays, injuryDays };
        }

        function renderPsMatrixBox(s, sIdx, seriesKey, title, maxG, players) {
            let html = `
                <div class="bg-slate-50 dark:bg-slate-900 p-4 rounded-2xl border space-y-3">
                    <h3 class="font-bold text-sm">${title}</h3>
                    <div class="overflow-x-auto custom-scrollbar">
                        <table class="w-full text-xs text-center border-collapse">
                            <thead class="bg-slate-100 dark:bg-slate-800 text-slate-500">
                                <tr>
                                    <th class="p-2 text-left min-w-[100px]">선수 (상태)</th>
            `;
            for (let g = 1; g <= maxG; g++) {
                html += `<th class="p-2 min-w-[42px] border-l font-bold">${g}차전</th>`;
            }
            html += `</tr></thead><tbody class="divide-y">`;

            if (!s.psSeriesPlayerStatus) s.psSeriesPlayerStatus = { ds: {}, cs: {}, ws: {} };
            if (!s.psSeriesPlayerStatus[seriesKey]) s.psSeriesPlayerStatus[seriesKey] = {};

            let seriesCarryover = {};
            if (seriesKey === 'ds') {
                players.forEach(p => {
                    let carry = getPlayerCarryoverStatus(s, p.name);
                    if (carry.activeStatus && carry.remainingDays > 0) {
                        seriesCarryover[p.name] = { status: carry.activeStatus, left: carry.remainingDays };
                    }
                });
            } else if (seriesKey === 'cs' || seriesKey === 'ws') {
                let prevSeriesKey = seriesKey === 'cs' ? 'ds' : 'cs';
                let prevMaxG = seriesKey === 'cs' ? 5 : 7;
                
                players.forEach(p => {
                    let prevStatusMap = s[`_${prevSeriesKey}_computedStatus_${p.name}`] || {};
                    let lastDayStatus = prevStatusMap[prevMaxG];
                    let lastDayLeft = prevStatusMap[`${prevMaxG}_left`] || 0;

                    if (lastDayStatus && lastDayLeft > 0) {
                        seriesCarryover[p.name] = { status: lastDayStatus, left: lastDayLeft };
                    }
                });
            }

            players.forEach(p => {
                let carryInfo = seriesCarryover[p.name];
                let userManualStatus = s.psSeriesPlayerStatus[seriesKey]?.[p.name];

                let effectiveStatus = userManualStatus || '미등록';
                if (!userManualStatus) {
                    if (carryInfo && carryInfo.left > 0) {
                        effectiveStatus = '부상';
                    }
                }

                let dotColor = effectiveStatus === '등록' ? 'bg-blue-500' : (effectiveStatus === '부상' ? 'bg-rose-500' : 'bg-amber-400');
                let rowBgStyle = (effectiveStatus === '미등록' || effectiveStatus === '부상') ? 'bg-slate-200/70 dark:bg-slate-800/80 text-slate-400' : '';

                html += `
                    <tr class="${rowBgStyle}">
                        <td class="p-2 text-left font-bold flex items-center justify-between border-r">
                            <span class="truncate max-w-[75px]" title="${p.name}">${p.name}</span>
                            <span onclick="cyclePsPlayerStatus(${sIdx}, '${seriesKey}', '${p.name}')" class="inline-block w-3 h-3 rounded-full ${dotColor} cursor-pointer" title="클릭 시 상태변경 (등록->부상->미등록)"></span>
                        </td>
                `;

                let curCarryLeft = carryInfo ? carryInfo.left : 0;
                let curCarryStatus = carryInfo ? carryInfo.status : null;
                let playerTimelineStatusMap = {};

                for (let g = 1; g <= maxG; g++) {
                    let pGameRec = s.postseasonGames?.[seriesKey]?.[g]?.players?.[p.name];
                    let cellText = '';
                    let cellClass = 'text-slate-400';

                    if (effectiveStatus === '부상' && curCarryLeft > 0) {
                        let badgeLbl = curCarryStatus;
                        if (badgeLbl === '부상 15일') badgeLbl = 'IL-15';
                        else if (badgeLbl === '부상 30일') badgeLbl = 'IL-30';
                        else if (badgeLbl === '부상 60일') badgeLbl = 'IL-60';
                        else if (badgeLbl === '시즌아웃') badgeLbl = 'OUT';
                        else if (badgeLbl === '토미존') badgeLbl = 'TJS';
                        else if (badgeLbl === '마이너') badgeLbl = '마이너';

                        cellText = badgeLbl;
                        cellClass = 'text-rose-600 font-bold text-[9px] bg-rose-50 dark:bg-rose-950 px-1 rounded';
                        playerTimelineStatusMap[g] = curCarryStatus;
                        curCarryLeft--;
                    } else {
                        if (pGameRec && pGameRec.stat) {
                            if (pGameRec.stat === '승') { cellText = '승'; cellClass = 'text-blue-600 font-bold bg-blue-50 dark:bg-blue-950 px-1 rounded'; }
                            else if (pGameRec.stat === '패') { cellText = '패'; cellClass = 'text-rose-600 font-bold bg-rose-50 dark:bg-rose-950 px-1 rounded'; }
                            else if (pGameRec.stat === '홀드') { cellText = '홀드'; cellClass = 'text-emerald-600 font-bold bg-emerald-50 dark:bg-emerald-950 px-1 rounded'; }
                            else if (pGameRec.stat === '세이브') { cellText = '세이브'; cellClass = 'text-purple-600 font-bold bg-purple-50 dark:bg-purple-950 px-1 rounded'; }
                            else if (pGameRec.stat === '등판') { cellText = 'ND'; cellClass = 'text-slate-600 font-bold bg-slate-100 dark:bg-slate-800 px-1 rounded'; }
                            else if (pGameRec.stat === '블론') { cellText = 'BS'; cellClass = 'text-amber-600 font-bold bg-amber-50 dark:bg-amber-950 px-1 rounded'; }
                        }
                    }
                    playerTimelineStatusMap[`${g}_left`] = curCarryLeft;

                    html += `
                        <td class="p-1 border-l hover:bg-slate-300/40 dark:hover:bg-slate-700 cursor-pointer text-center" onclick="openPsPlayerStatModal(${sIdx}, '${seriesKey}', ${g}, '${p.name}')">
                            <span class="text-[10px] ${cellClass}">${cellText}</span>
                        </td>
                    `;
                }
                s[`_${seriesKey}_computedStatus_${p.name}`] = playerTimelineStatusMap;
                html += `</tr>`;
            });
            html += `</tbody></table></div></div>`;
            return html;
        }

                        <div class="font-bold text-xs">${p.name}</div>
                        <div class="grid grid-cols-7 gap-1 text-center">
                            <div><label class="text-[9px] text-slate-400">ERA</label><input type="text" value="${st.era || ''}" onchange="updatePsStat(${sIdx}, '${statKey}', 'era', this.value)" class="w-full border rounded text-[10px] text-center bg-transparent"></div>
                            <div><label class="text-[9px] text-slate-400">IP</label><input type="text" value="${st.ip || ''}" onchange="updatePsStat(${sIdx}, '${statKey}', 'ip', this.value)" class="w-full border rounded text-[10px] text-center bg-transparent"></div>
                            <div><label class="text-[9px] text-slate-400">K</label><input type="text" value="${st.k || ''}" onchange="updatePsStat(${sIdx}, '${statKey}', 'k', this.value)" class="w-full border rounded text-[10px] text-center bg-transparent"></div>
                            <div><label class="text-[9px] text-slate-400">W</label><input type="text" value="${st.win || ''}" onchange="updatePsStat(${sIdx}, '${statKey}', 'win', this.value)" class="w-full border rounded text-[10px] text-center bg-transparent"></div>
                            <div><label class="text-[9px] text-slate-400">L</label><input type="text" value="${st.loss || ''}" onchange="updatePsStat(${sIdx}, '${statKey}', 'loss', this.value)" class="w-full border rounded text-[10px] text-center bg-transparent"></div>
                            <div><label class="text-[9px] text-slate-400">H</label><input type="text" value="${st.hold || ''}" onchange="updatePsStat(${sIdx}, '${statKey}', 'hold', this.value)" class="w-full border rounded text-[10px] text-center bg-transparent"></div>
                            <div><label class="text-[9px] text-slate-400">SV</label><input type="text" value="${st.save || ''}" onchange="updatePsStat(${sIdx}, '${statKey}', 'save', this.value)" class="w-full border rounded text-[10px] text-center bg-transparent"></div>
                        </div>
                        <input type="text" value="${comment.title || ''}" onchange="updatePsCommentTitle(${sIdx}, '${seriesEvalKey}', '${p.name}', this.value)" placeholder="평가 제목" class="w-full text-xs border rounded px-2 py-1 font-semibold bg-transparent">
                        <button onclick="openMemoModal(${sIdx}, 'psEval', '${seriesEvalKey}', '${p.name}')" class="text-[10px] text-brand-600 underline font-semibold">전체 평가 보기</button>
                    </div>
                `;
            });
            html += `</div>`;
            return html;
        }

        function openModal(sIdx, category, playerName, gameNum) {
            cellCtx = { sIdx, category, playerName, gameNum };
            const season = seasons[sIdx];
            const gameData = season.gamesData[category]?.[playerName]?.[gameNum] || {};
            document.getElementById('modalTitle').textContent = `[${playerName}] ${category.toUpperCase()} ${gameNum}G 상태 변경`;
            document.getElementById('modalComment').value = gameData.comment || '';
            const select = document.getElementById('modalStatusSelect');
            const currentStatus = gameData.status || '';
            if (currentStatus.includes('부상') || currentStatus.includes('시즌아웃') || currentStatus.includes('토미존')) {
                select.value = '부상'; document.getElementById('modalInjuryType').value = currentStatus;
            } else if (currentStatus === '마이너') { select.value = '마이너'; }
            else if (currentStatus === '메이저') { select.value = '메이저'; }
            else { select.value = '공백'; }
            toggleModalInjuryOption();
            document.getElementById('statusModal').classList.remove('hidden');
        }
        function toggleModalInjuryOption() { document.getElementById('modalInjuryBox').classList.toggle('hidden', document.getElementById('modalStatusSelect').value !== '부상'); }
        function closeModal() { document.getElementById('statusModal').classList.add('hidden'); }

        function saveModalStatus() {
            const { sIdx, category, playerName, gameNum } = cellCtx;
            if (sIdx === null) return;
            const season = seasons[sIdx];
            const statusType = document.getElementById('modalStatusSelect').value;
            const comment = document.getElementById('modalComment').value.trim();
            let finalStatus = statusType === '부상' ? document.getElementById('modalInjuryType').value : statusType;

            if (!season.gamesData[category]) season.gamesData[category] = {};
            if (!season.gamesData[category][playerName]) season.gamesData[category][playerName] = {};

            if (finalStatus === '공백') delete season.gamesData[category][playerName][gameNum];
            else season.gamesData[category][playerName][gameNum] = { status: finalStatus, comment };

            closeModal(); saveStateToStorage(); refreshAppUI();
        }

        function cyclePsPlayerStatus(sIdx, seriesKey, playerName) {
            const season = seasons[sIdx];
            if (!season.psSeriesPlayerStatus) season.psSeriesPlayerStatus = { ds: {}, cs: {}, ws: {} };
            if (!season.psSeriesPlayerStatus[seriesKey]) season.psSeriesPlayerStatus[seriesKey] = {};
            let cur = season.psSeriesPlayerStatus[seriesKey][playerName] || '미등록';
            let next = cur === '미등록' ? '등록' : (cur === '등록' ? '부상' : '미등록');
            season.psSeriesPlayerStatus[seriesKey][playerName] = next;
            saveStateToStorage(); refreshAppUI();
        }

        function openPsPlayerStatModal(sIdx, series, gameNum, playerName) {
            psPlayerCtx = { sIdx, series, gameNum, playerName };
            document.getElementById('psPlayerModalTitle').textContent = `${series.toUpperCase()} ${gameNum}차전 [${playerName}] 성적 선택`;
            let rec = seasons[sIdx].postseasonGames?.[series]?.[gameNum] || { players: {} };
            let pRec = rec.players?.[playerName] || { stat: '' };
            document.getElementById('modalPlayerStatSelect').value = pRec.stat || '';
            document.getElementById('psPlayerStatModal').classList.remove('hidden');
        }
        function closePsPlayerModal() { document.getElementById('psPlayerStatModal').classList.add('hidden'); }
        function savePsPlayerStatModal() {
            const { sIdx, series, gameNum, playerName } = psPlayerCtx; const season = seasons[sIdx];
            if (!season.postseasonGames[series]) season.postseasonGames[series] = {};
            if (!season.postseasonGames[series][gameNum]) season.postseasonGames[series][gameNum] = { result: '승', score: '', players: {} };
            if (!season.postseasonGames[series][gameNum].players) season.postseasonGames[series][gameNum].players = {};

            let statVal = document.getElementById('modalPlayerStatSelect').value;
            if (statVal) {
                if (!season.postseasonGames[series][gameNum].players[playerName]) season.postseasonGames[series][gameNum].players[playerName] = {};
                season.postseasonGames[series][gameNum].players[playerName].stat = statVal;
            } else {
                if (season.postseasonGames[series][gameNum].players[playerName]) {
                    delete season.postseasonGames[series][gameNum].players[playerName].stat;
                }
            }
            closePsPlayerModal(); saveStateToStorage(); refreshAppUI(); alert('저장되었습니다.');
        }

        function triggerUpdateUpToGame(sIdx, targetGameNum) {
            const season = seasons[sIdx]; const players = sortMatrixPlayers(getSeasonEffectiveRoster(season).filter(p => p.type !== '방출'));
            if (!confirm(`${targetGameNum}G까지 공백 칸을 최신화하시겠습니까?`)) return;
            const grandTimeline = getGrandMasterTimeline(); let targetIdx = grandTimeline.findIndex(t => t.category === 'reg' && t.type === 'game' && t.gNum === targetGameNum);
            
            players.forEach(p => {
                const { timeline, statusMap } = computePlayerTimelineStatus(season, p.name); let latestStatus = null, latestIdx = null;
                for (let i = targetIdx; i >= 0; i--) { if (timeline[i].type === 'game' && statusMap[i]?.status && (statusMap[i].status === '메이저' || statusMap[i].status === '마이너')) { latestStatus = statusMap[i].status; latestIdx = i; break; } }
                if (latestStatus && latestIdx !== null) {
                    for (let i = latestIdx + 1; i <= targetIdx; i++) {
                        let tItem = timeline[i];
                        if (tItem.type === 'game') {
                            if (!season.gamesData['reg']) season.gamesData['reg'] = {};
                            if (!season.gamesData['reg'][p.name]) season.gamesData['reg'][p.name] = {};
                            if (!season.gamesData['reg'][p.name][tItem.gNum]?.status) season.gamesData['reg'][p.name][tItem.gNum] = { status: latestStatus, comment: '최신화' };
                        }
                    }
                }
            });

            if (Math.random() < 0.13) {
                let eligibleCandidates = [];
                players.forEach(p => {
                    if (p.type === '절대 선수' || p.type === '현역' || p.type === '밀전드') {
                        const { timeline, statusMap } = computePlayerTimelineStatus(season, p.name);
                        let curSt = statusMap[targetIdx]?.status;
                        if (curSt === '메이저' || !curSt) {
                            eligibleCandidates.push(p);
                        }
                    }
                });

                if (eligibleCandidates.length > 0) {
                    let injuredPlayer = eligibleCandidates[Math.floor(Math.random() * eligibleCandidates.length)];
                    let r = Math.random() * 100;
                    let injuryType = '';
                    let injuryLabel = '';
                    if (r < 35) { injuryType = '부상 15일'; injuryLabel = '15일 부상'; }
                    else if (r < 35 + 25) { injuryType = '부상 30일'; injuryLabel = '30일 부상'; }
                    else if (r < 35 + 25 + 20) { injuryType = '부상 60일'; injuryLabel = '60일 부상'; }
                    else if (r < 35 + 25 + 20 + 15) { injuryType = '시즌아웃'; injuryLabel = '시즌 아웃'; }
                    else { injuryType = '토미존'; injuryLabel = '토미존 수술'; }

                    if (!season.gamesData['reg']) season.gamesData['reg'] = {};
                    if (!season.gamesData['reg'][injuredPlayer.name]) season.gamesData['reg'][injuredPlayer.name] = {};
                    season.gamesData['reg'][injuredPlayer.name][targetGameNum] = { status: injuryType, comment: '자동 부상 발생' };

                    alert(`[${injuredPlayer.name}(${injuredPlayer.position})] 선수가 ${injuryLabel}의 부상을 당했습니다.`);
                }
            }

            saveStateToStorage(); refreshAppUI(); alert('최신화 완료');
        }

        function openMemoModal(sIdx, evalType, rangeType, playerName) {
            memoCtx = { sIdx, evalType, rangeType, playerName };
            const season = seasons[sIdx]; let content = '';
            if (evalType === 'seasonEval') content = season.seasonEval[rangeType === 'firstHalf' ? 'firstHalfComments' : 'fullSeasonComments']?.[playerName]?.body || '';
            else if (evalType === 'psEval') content = season.psEval[rangeType]?.[playerName]?.body || '';
            document.getElementById('memoModalTitle').textContent = `[${playerName}] 전체 평가 메모장`;
            document.getElementById('memoModalTextarea').value = content;
            document.getElementById('memoModal').classList.remove('hidden');
        }
        function closeMemoModal() { document.getElementById('memoModal').classList.add('hidden'); }
        function saveMemoModal() {
            const { sIdx, evalType, rangeType, playerName } = memoCtx; const season = seasons[sIdx];
            let bodyText = document.getElementById('memoModalTextarea',).value;
            if (evalType === 'seasonEval') {
                let key = rangeType === 'firstHalf' ? 'firstHalfComments' : 'fullSeasonComments';
                if (!season.seasonEval[key][playerName]) season.seasonEval[key][playerName] = { title: '', body: '' };
                season.seasonEval[key][playerName].body = bodyText;
            } else if (evalType === 'psEval') {
                if (!season.psEval[rangeType][playerName]) season.psEval[rangeType][playerName] = { title: '', body: '' };
                season.psEval[rangeType][playerName].body = bodyText;
            }
            closeMemoModal(); saveStateToStorage(); refreshAppUI(); alert('평가 본문이 저장되었습니다.');
        }

        function updateTeamEval(sIdx, field, val) { seasons[sIdx].seasonEval[field] = val; saveStateToStorage(); }
        function updatePlayerStat(sIdx, statKey, field, val) { if (!seasons[sIdx].seasonEval.playerData[statKey]) seasons[sIdx].seasonEval.playerData[statKey] = {}; seasons[sIdx].seasonEval.playerData[statKey][field] = val; saveStateToStorage(); }
        function updateCommentTitle(sIdx, rangeType, playerName, val) { let key = rangeType === 'firstHalf' ? 'firstHalfComments' : 'fullSeasonComments'; if (!seasons[sIdx].seasonEval[key][playerName]) seasons[sIdx].seasonEval[key][playerName] = { title: '', body: '' }; seasons[sIdx].seasonEval[key][playerName].title = val; saveStateToStorage(); }
        function updatePsEvalHead(sIdx, field, val) { seasons[sIdx].psEval[field] = val; saveStateToStorage(); }
        function updatePsStat(sIdx, statKey, field, val) { if (!seasons[sIdx].psEval.playerData[statKey]) seasons[sIdx].psEval.playerData[statKey] = {}; seasons[sIdx].psEval.playerData[statKey][field] = val; saveStateToStorage(); }
        function updatePsCommentTitle(sIdx, seriesEvalKey, playerName, val) { if (!seasons[sIdx].psEval[seriesEvalKey][playerName]) seasons[sIdx].psEval[seriesEvalKey][playerName] = { title: '', body: '' }; seasons[sIdx].psEval[seriesEvalKey][playerName].title = val; saveStateToStorage(); }
    </script>
</body>
</html>
